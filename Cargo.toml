[package]
name = "Airoro"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
dotenv = "0.15.0"
rand = "0.10.3"
tokio = { version = "1.21.2", features = ["macros", "rt-multi-thread"] }
rosu-v2 = "0.11.0"
openssl = { version = "0.10.81", features = ["vendored"] }
openssl-sys = { version="0.9.117", features = ["vendored"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio-rustls", "sqlite"] }

[dependencies.serenity]
git = "https://github.com/serenity-rs/serenity"
branch = "next"
features = ["gateway", "model", "native_tls_backend", "builder"]
